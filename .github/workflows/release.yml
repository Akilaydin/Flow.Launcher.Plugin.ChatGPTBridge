name: Publish Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - .github/workflows/*
      - README.md
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Get version
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
          path: 'plugin.json'
          prop_path: 'Version'

      - name: Build
        run: |
          dotnet publish 'Flow.Launcher.Plugin.ChatGPTBridge.csproj' -r win-x64 -c Release -o "Flow.Launcher.Plugin.ChatGPTBridge-${{ steps.version.outputs.prop }}"
          7z a -tzip "Flow.Launcher.Plugin.ChatGPTBridge-${{ steps.version.outputs.prop }}.zip" "./Flow.Launcher.Plugin.ChatGPTBridge-${{ steps.version.outputs.prop }}/*"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: "Flow.Launcher.Plugin.ChatGPTBridge-*.zip"
          tag_name: "v${{ steps.version.outputs.prop }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
